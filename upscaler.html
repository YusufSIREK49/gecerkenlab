<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Çözünürlük Artırıcı | BTÜ Geçerken Lab</title>
  <meta name="description" content="2x ve 4x derin öğrenme modelleriyle fotoğrafları, videoları ve taranmış PDF sayfalarını netleştirip onarın.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23009B77'/%3E%3Cpath fill='%23ffffff' d='M7 2v2h1v5l-4.22 8.44C3.26 18.48 4 20 5.24 20h13.52c1.24 0 1.98-1.52 1.46-2.56L16 9V4h1V2H7zm3 2h4v5.5l1.5 3H8.5L10 9.5V4z'/%3E%3Ccircle cx='10.5' cy='16.5' r='1.2' fill='%2340E0D0'/%3E%3Ccircle cx='13.5' cy='15' r='0.9' fill='%2340E0D0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TR:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="labsnavbar.css">
  <link rel="stylesheet" href="labs.css">
</head>
<body>

  <div id="lab-navbar-root"></div>

  <main class="lab-shell">
    <div class="lab-workspace-card">
      <div class="lab-workspace-header">
        <div>
          <span class="section-label">Araç 04 // Sinir Ağları &amp; Piksel Onarımı</span>
          <h2 class="lab-tool-heading">AI <em>Upscaler</em></h2>
        </div>
        <span class="lab-head-pill"><i class="fa-solid fa-wand-magic-sparkles"></i> Görsel, Video &amp; PDF Onarımı</span>
      </div>

      <div class="lab-split-workspace">
        <div class="lab-dropzone" id="upscalerDropzone">
          <input type="file" id="upscalerFileInput" accept="image/*,video/mp4,video/quicktime,video/x-matroska,application/pdf,.svg" hidden>
          <div class="dropzone-center">
            <div class="drop-circle"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <p class="drop-lead" id="upscalerDropLead">Netleştirilecek dosyayı yükleyin</p>
            <span class="drop-hint">Düşük pikselli fotoğraflar, eski videolar veya taranmış PDF'ler</span>
            <span class="drop-badge">2x / 4x Derin Öğrenme</span>
          </div>
          <div class="dropzone-preview" id="upscalerPreviewWrap" style="display:none;">
            <img id="upscalerImgPreview" src="" alt="Upscale Önizleme" style="display:none;">
            <div id="upscalerMediaInfo" style="display:none; text-align:center; padding:20px;">
              <i id="upscalerMediaIcon" class="fa-solid fa-file-arrow-up fa-3x" style="color:var(--emerald);"></i>
              <p id="upscalerFileName" style="margin-top:10px; font-weight:700; font-family:'Syne',sans-serif;"></p>
            </div>
            <button type="button" class="btn-clear-file" id="upscalerClearBtn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="lab-controls-pane">
          <h4 class="pane-title"><i class="fa-solid fa-microchip"></i> AI Model Ayarları</h4>

          <div class="toggle-cards">
            <label class="toggle-card active">
              <input type="radio" name="upscaleFactor" value="2" checked hidden>
              <span class="t-title">2X Büyütme</span>
              <span class="t-sub">Dengeli &amp; Hızlı Netleştirme</span>
            </label>
            <label class="toggle-card">
              <input type="radio" name="upscaleFactor" value="4" hidden>
              <span class="t-title">4X Ultra HD</span>
              <span class="t-sub">Baskı &amp; 4K Detay Onarımı</span>
            </label>
          </div>

          <div class="input-group" id="upscaleModeGroup">
            <label for="upscaleMode">İçerik Türü &amp; İşlem Modu</label>
            <select id="upscaleMode" class="lab-select">
              <option value="photo">Fotoğraf &amp; Portre (Gürültü Giderme)</option>
              <option value="digital">Dijital Çizim &amp; Logo (Keskin Hatlar)</option>
            </select>
          </div>

          <div class="action-footer">
            <button type="button" class="btn-primary w-100" id="upscalerProcessBtn">
              <i class="fa-solid fa-bolt-lightning"></i> AI ile Netleştir &amp; İndir
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="lab-footer-root"></div>
  <div id="labToastContainer" class="lab-toast-container"></div>

  <!-- Ortak Sistemler -->
  <script src="labsnavbar.js"></script>
  <script src="labsfooter.js"></script>
  <script src="labs-core.js"></script>

  <!-- Yalnızca Bu Aracın Modülü -->
  <script type="module">
    import { initUpscalerModule } from './modules/upscaler.js';
    document.addEventListener('DOMContentLoaded', initUpscalerModule);
  </script>
</body>
</html>

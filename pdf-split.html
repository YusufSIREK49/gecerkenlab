<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Sayfa Ayırıcı | BTÜ Geçerken Lab</title>
  <meta name="description" content="PDF sayfalarını aralık belirleyerek ayırın veya sayfaları tek tek ayıklayın.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23009B77'/%3E%3Cpath fill='%23ffffff' d='M7 2v2h1v5l-4.22 8.44C3.26 18.48 4 20 5.24 20h13.52c1.24 0 1.98-1.52 1.46-2.56L16 9V4h1V2H7zm3 2h4v5.5l1.5 3H8.5L10 9.5V4z'/%3E%3Ccircle cx='10.5' cy='16.5' r='1.2' fill='%2340E0D0'/%3E%3Ccircle cx='13.5' cy='15' r='0.9' fill='%2340E0D0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TR:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="labsnavbar.css">
  <link rel="stylesheet" href="labs.css">
</head>
<body>

  <div id="lab-navbar-root"></div>

  <main class="lab-shell">
    <div class="lab-workspace-card">
      <div class="lab-workspace-header">
        <div>
          <span class="section-label">PDF Stüdyosu // Sayfa Ayıklama</span>
          <h2 class="lab-tool-heading">PDF <em>Sayfa Ayırıcı</em></h2>
        </div>
        <span class="lab-head-pill"><i class="fa-solid fa-scissors"></i> Sayfa Aralığı Filtresi</span>
      </div>

      <div class="lab-split-workspace">
        <div class="lab-dropzone" id="pdfSplitDropzone">
          <input type="file" id="pdfSplitInput" accept="application/pdf" hidden>
          <div class="dropzone-center">
            <div class="drop-circle"><i class="fa-solid fa-file-pdf"></i></div>
            <p class="drop-lead">Ayıklanacak PDF'i Yükleyin</p>
            <span class="drop-hint">Tekil bir PDF dokümanı seçin</span>
          </div>
          <div class="dropzone-preview" id="pdfSplitPreviewWrap" style="display:none;">
            <div style="text-align:center; padding:20px;">
              <i class="fa-solid fa-file-pdf fa-3x" style="color:var(--emerald);"></i>
              <p id="pdfSplitFileName" style="margin-top:10px; font-weight:700; font-family:'Syne',sans-serif;"></p>
              <span id="pdfSplitPageCount" class="drop-badge">Toplam 0 Sayfa</span>
            </div>
            <button type="button" class="btn-clear-file" id="pdfSplitClearBtn"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="lab-controls-pane" id="pdfSplitCardBody">
          <h4 class="pane-title"><i class="fa-solid fa-sliders"></i> Ayırma Ayarları</h4>
          <div class="input-group">
            <label for="pdfSplitRange">Sayfa Aralığı Belirtin</label>
            <input type="text" id="pdfSplitRange" placeholder="Örn: 1-3, 5, 8-10">
            <span class="pane-note">Virgül veya tire ile sayfa numarası yazın. Boş bırakırsanız tüm sayfalar tek tek ayrılır.</span>
          </div>
          <div class="action-footer">
            <button type="button" class="btn-primary w-100" id="pdfSplitExecBtn"><i class="fa-solid fa-scissors"></i> Sayfaları Ayır &amp; İndir</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="lab-footer-root"></div>
  <div id="labToastContainer" class="lab-toast-container"></div>

  <!-- PDF-LIB Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <!-- Ortak Sistemler -->
  <script src="labsnavbar.js"></script>
  <script src="labsfooter.js"></script>
  <script src="labs-core.js"></script>

  <!-- Modül Başlatıcı -->
  <script type="module">
    import { initPdfSplit } from './modules/pdf-tools.js';
    document.addEventListener('DOMContentLoaded', initPdfSplit);
  </script>
</body>
</html>

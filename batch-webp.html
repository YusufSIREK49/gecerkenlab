<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplu WebP Dönüştürücü | BTÜ Geçerken Lab</title>
  <meta name="description" content="Birden fazla görseli ultra hafif WebP formatına dönüştürüp ZIP olarak indirin.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23009B77'/%3E%3Cpath fill='%23ffffff' d='M7 2v2h1v5l-4.22 8.44C3.26 18.48 4 20 5.24 20h13.52c1.24 0 1.98-1.52 1.46-2.56L16 9V4h1V2H7zm3 2h4v5.5l1.5 3H8.5L10 9.5V4z'/%3E%3Ccircle cx='10.5' cy='16.5' r='1.2' fill='%2340E0D0'/%3E%3Ccircle cx='13.5' cy='15' r='0.9' fill='%2340E0D0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TR:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="labsnavbar.css">
  <link rel="stylesheet" href="labs.css">
</head>
<body>

  <div id="lab-navbar-root"></div>

  <main class="lab-shell">
    <div class="lab-workspace-card">
      <div class="lab-workspace-header">
        <div>
          <span class="section-label">Görsel &amp; AI // Web Standartları</span>
          <h2 class="lab-tool-heading">Toplu <em>WebP Dönüştürücü</em></h2>
        </div>
        <span class="lab-head-pill"><i class="fa-solid fa-bolt"></i> Ultra Hızlı Yerel Canvas</span>
      </div>

      <div class="fc-converter-container">
        <div class="fc-upload-zone" id="batchWebpDropzone">
          <input type="file" id="batchWebpInput" accept="image/*" multiple hidden>
          <div class="fc-upload-content">
            <div class="fc-icon-bubble"><i class="fa-solid fa-bolt"></i></div>
            <h3 class="fc-upload-title">Toplu Resimleri Buraya Bırakın</h3>
            <p class="fc-upload-desc">Tüm görseller doğrudan tarayıcı içinde WebP formatına çevrilir</p>
            <button type="button" class="btn-primary fc-choose-btn"><i class="fa-solid fa-images"></i> Resimleri Seç</button>
          </div>
        </div>

        <div class="fc-process-area" id="batchWebpProcessArea" style="display: none;">
          <div class="fc-table-header">
            <span>Dosya Adı</span>
            <span>Kalite Oranı</span>
            <span>İşlem</span>
          </div>
          <div class="fc-file-list" id="batchWebpList"></div>
          <div class="fc-bottom-actions">
            <button type="button" class="chip-btn" id="batchWebpAddMoreBtn"><i class="fa-solid fa-plus"></i> Daha Fazla Ekle</button>
            <button type="button" class="btn-primary" id="batchWebpExecBtn"><i class="fa-solid fa-file-zipper"></i> Tümünü WebP Yap &amp; ZIP İndir</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="lab-footer-root"></div>
  <div id="labToastContainer" class="lab-toast-container"></div>

  <!-- ZIP Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Ortak Sistemler -->
  <script src="labsnavbar.js"></script>
  <script src="labsfooter.js"></script>
  <script src="labs-core.js"></script>

  <!-- Modül Başlatıcı -->
  <script type="module">
    import { initBatchWebp } from './modules/image-tools.js';
    document.addEventListener('DOMContentLoaded', initBatchWebp);
  </script>
</body>
</html>
